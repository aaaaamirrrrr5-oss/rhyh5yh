name: Deploy PWA
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['www/**', 'tests/**', 'package.json', '.github/workflows/deploy-pwa.yml']
permissions:
  contents: write
  pages: write
concurrency: { group: pages-deploy, cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/pwa.test.cjs && node tests/rebuild.test.cjs && node tests/engine.test.cjs
  deploy:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # publish www/ to the gh-pages branch (does not need the Pages API, so it never fails with "Not Found")
      - name: Publish to gh-pages branch
        run: |
          cp -r www /tmp/site
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      # best-effort: turn on Pages from gh-pages; never fails the job
      - name: Enable Pages (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" \
          || gh api -X PUT "repos/${{ github.repository }}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" \
          || echo "Pages already enabled or needs manual enable"
      - name: Site URL
        run: echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
